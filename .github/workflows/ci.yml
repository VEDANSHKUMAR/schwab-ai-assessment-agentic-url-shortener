name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urlshortener
          POSTGRES_PASSWORD: urlshortener
          POSTGRES_DB: urlshortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshortener -d urlshortener"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Database=urlshortener;Username=urlshortener;Password=urlshortener
      TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Restore
        run: dotnet restore UrlShortener.sln

      - name: Build
        run: dotnet build UrlShortener.sln --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/UrlShortener.UnitTests --no-build -c Release --verbosity normal

      - name: Integration tests
        run: dotnet test tests/UrlShortener.IntegrationTests --no-build -c Release --verbosity normal

      - name: End-to-end tests
        run: dotnet test tests/UrlShortener.EndToEndTests --no-build -c Release --verbosity normal

      - name: Client build
        working-directory: client
        run: npm ci && npm run build

      - name: Docker image build
        run: docker build -t linkforge:ci .
        continue-on-error: true
